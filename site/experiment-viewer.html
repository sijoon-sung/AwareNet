<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AwareNet 실험 기록</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#303332;background:#fafaf9;font:20px/1.5 "Malgun Gothic",sans-serif}header{height:62px;display:flex;align-items:center;gap:35px;padding:0 30px;background:#f0f1ee;border-bottom:1px solid #ddd}header strong{font-size:24px;font-weight:500}header small{color:#626a68}header .controls{margin-left:auto;display:flex;align-items:center;gap:16px}button{font:inherit;font-size:18px;border:1px solid #c8cecb;background:white;padding:5px 18px;cursor:pointer;color:#303332}button:focus-visible{outline:2px solid #486777}nav{height: sixty;display:flex;height: sixty}nav{height:60px;padding-left:245px;background:white;border-bottom:1px solid #dddfdc;gap:45px}nav button{width:335px;border:0;border-bottom:2px solid transparent;background:none;text-align:left;font-size:22px}nav button.active{border-color:#486777}aside{position:absolute;top:122px;bottom:48px;width:220px;background:#f4f5f2;padding:22px}aside h3{font-size:19px;font-weight:400;color:#6b706f;margin:0 0 42px}aside h4{font-size:17px;font-weight:400;color:#6b706f;margin:36px 0 10px}aside p{font-size:17px;margin:0 0 6px}main{margin-left:220px;padding:18px 30px;height:910px}h1{font-size:29px;font-weight:400;margin:0 0 14px}h1 small{float:right;font:19px Consolas,monospace;color:#6b706f;padding-top:10px}.grid{display:grid;grid-template-columns:550px 1fr;gap:25px}section{border:1px solid #dddfdc;background:white}section h2{font-size:22px;font-weight:400;border-bottom:1px solid #dddfdc;padding:8px 18px;margin:0}.body{padding:18px 22px}.client{display:flex;align-items:center;gap:22px;height:123px}.client img{width:110px;height:105px;object-fit:contain;background:#181d20}.client p{margin:4px 0;font-size:23px}.muted{color:#6b706f}.mono{font-family:Consolas,monospace}.channels{font-size:18px;color:#6b706f}.bar{display:inline-block;width:180px;background:#e0e4e1;height:5px;margin-left:15px;vertical-align:middle}.bar i{display:block;height:100%;background:#486777}.metric{font-size:40px;font-weight:400;margin:0 0 0 6px}.metric small{font-size:22px;color:#6b706f;margin-left:65px}.console{margin-top:22px;background:#242827;color:#c6cdc8;height:298px}.console h2{background:#303533;color:#cfd4d0;font:20px Consolas,monospace;border:0;padding:8px 18px}.console pre{font:22px/1.35 Consolas,monospace;margin:15px 20px;white-space:pre-wrap}.console .updated{color:#a9c1c9}svg{width:100%;display:block}footer{position:fixed;bottom:0;width:100%;height:48px;border-top:1px solid #ddd;background:#fafaf9;padding:10px 30px 10px 250px;color:#6b706f;font-size:18px}footer span{float:right}.inference{grid-template-columns:600px 1fr}.xray{height:490px;width:100%;object-fit:contain;background:#141a1f}.prediction{padding:16px 0 32px}.prediction h3{font-size:25px;margin:0 0 16px;font-weight:400}.prob{display:flex;align-items:center;gap:22px;margin:16px 0;font-size:22px}.prob .track{height:20px;background:#e7eae8;width:570px}.prob i{display:block;height:100%;background:#486777}.resultstrip{padding:17px 22px;margin-top:22px;display:flex;justify-content:space-between;align-items:center;font-size:25px}.dep{height:123px;padding:12px 0}.dep h3{margin:0 0 18px;font-weight:400;font-size:26px}.dep p{margin:0;font-size:22px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:25px}.answer{font-size:31px;min-height:170px;margin:30px 6px 16px}.question{font-size:29px;min-height:116px;margin:16px 5px}.answerMeta{margin-top:30px}.timeGrid{grid-template-columns:1.8fr 1fr}.change{font-size:20px;white-space:pre;line-height:1.8}.legend{display:flex;gap:50px;font-size:22px}.summary{width:100%;border-collapse:collapse;font-size:26px}.summary th{font-size:22px;font-weight:400;color:#6b706f;text-align:left;padding:18px 28px}.summary td{padding:19px 28px}.mini{height:18px;background:#9b9f9d;display:block;margin:0 0 8px}.note{font-size:21px;margin:24px 0 0}.wide{grid-template-columns:1fr}a{color:#486777}#seek{width:200px;accent-color:#486777}
</style></head><body>
<header><strong>AwareNet</strong><small>실험 기록 조회</small><div class="controls"><small>저장된 실행 재생</small><button id="play">재생</button><button id="reset">처음</button><input id="seek" type="range" min="0" max="112" step="0.1" value="0" aria-label="재생 위치"><span id="clock" class="mono">00:00 / 01:52</span></div></header>
<nav><button data-seek="0">01 영상 분류</button><button data-seek="34">02 업무 문답</button><button data-seek="66">03 KOREN 비교</button><button data-seek="98">04 결과</button></nav>
<aside id="settings"></aside><main id="content">실험 기록을 불러오는 중입니다.</main><footer id="source"></footer>
<script>
const colors=['#486777','#768879','#927d69'];let data,t=0,playing=false,last=performance.now(),lastDraw=-1;
const q=s=>document.querySelector(s),fmt=x=>x.toFixed(1),sec=x=>`${String(Math.floor(x/60)).padStart(2,'0')}:${String(Math.floor(x%60)).padStart(2,'0')}`;
const panel=(title,body,cl='')=>`<section class="${cl}"><h2>${title}</h2><div class="body">${body}</div></section>`;
const terminal=(name,lines)=>`<section class="console"><h2>${name}</h2><pre>${lines.join('\n')}</pre></section>`;
const image=n=>`assets/demo/viewer-images/${n}.png`;
function chart(series,{xmin=0,xmax=20,ymin=0,ymax=100,ticks=[0,50,100],log=false}={}){
 const w=900,h=302,L=75,R=25,T=15,B=53,X=x=>L+(x-xmin)/(xmax-xmin)*(w-L-R),Y=y=>h-B-(Math.max(ymin,Math.min(ymax,log?Math.log10(Math.max(y,1e-7)):y))-ymin)/(ymax-ymin)*(h-T-B);
 let svg=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="라운드별 측정 곡선">`;
 for(const y of ticks){let py=Y(log?10**y:y);svg+=`<line x1="${L}" y1="${py}" x2="${w-R}" y2="${py}" stroke="#e4e8e5"/><text x="8" y="${py+7}" fill="#6b706f" font-size="18">${log?'1e'+y:y}</text>`;}
 for(const [pts,c] of series){svg+=`<polyline fill="none" stroke="${c}" stroke-width="3" points="${pts.filter(([x])=>x>=xmin).map(([x,y])=>X(x)+','+Y(y)).join(' ')}"/>`;}
 for(const x of [xmin,Math.floor((xmin+xmax)/2),xmax])svg+=`<text x="${X(x)-8}" y="${h-20}" fill="#6b706f" font-size="18">${x}</text>`;
 return svg+`<text x="${w-82}" y="${h}" fill="#6b706f" font-size="17">round</text></svg>`;
}
function meta(active){
 const groups=active===0?[['모델','ResNet-18','분할 지점 2'],['클라이언트','가상 병원 A / B / C','학습 4,708장','시험 624장'],['환경','RTX 3080 · 로컬'],['데이터','PneumoniaMNIST+','공개 연구용 X-ray']]:active===1?[['모델','Qwen2.5-0.5B','LoRA rank 16'],['클라이언트','운영 / 고객지원 / 보안','가상 규정 9개','평가 질문 18개'],['환경','RTX 3080 · 로컬'],['집계','앞단 어댑터 평균','서버 뒷단 공동 갱신']]:[['측정 환경','기존 KOREN 실측','논리 클라이언트 32'],['모델','ResNet-18','CIFAR-10'],['비교 조건','기준: 연결 1개','AwareNet: 연결 2개'],['분석','초기 4라운드 제외','라운드 완료 시간']];
 q('#settings').innerHTML='<h3>실험 설정</h3>'+groups.map(([h,...vs])=>`<h4>${h}</h4>`+vs.map(x=>`<p>${x}</p>`).join('')).join('');
 document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===active));
}
function render(){
 const active=t<34?0:t<66?1:t<98?2:3;meta(active);let body='',source='';
 if(t<24){
 const hist=data.cnn,wall=hist.at(-1).elapsed*Math.min(1,t/21.5),row=hist.slice(1).filter(r=>r.elapsed<=wall).at(-1)||hist[1],r=row.round;
 const clients=row.clients.map((c,i)=>`<div class="client"><img src="${image('client_'+i+'_0')}" alt="공개 X-ray"><div><p>병원 ${'ABC'[i]} · client ${i}</p><p class="mono" style="color:${colors[i]}">width=${c.width.toFixed(2)} loss=${c.loss.toFixed(4)}</p><div class="channels">채널 사용률 ${c.width*100}%<span class="bar"><i style="width:${c.width*100}%"></i></span></div></div></div>`).join('');
 let logs=[];for(const rr of hist.slice(Math.max(1,r-1),r+1)){for(const c of rr.clients)logs.push(`round=${String(rr.round).padStart(2,'0')}  client=c${c.client}  width=${c.width.toFixed(2)}  loss=${c.loss.toFixed(6)}  act=[${c.activation_shape.join(', ')}]`);logs.push(`<span class="updated">round=${String(rr.round).padStart(2,'0')}  global_accuracy=${rr.accuracy.toFixed(6)}  elapsed=${rr.elapsed.toFixed(3)}s</span>`);}
 body=`<h1>CNN 학습　${r} / 20 라운드 <small>ResNet-18 / cut=2 / batch=16</small></h1><div class="grid">${panel('클라이언트별 학습',clients)}${panel('집계 후 시험 정확도',`<p class="metric">${fmt(row.accuracy*100)}% <small>시험 영상 624장</small></p>${chart([[hist.slice(0,r+1).map(v=>[v.round,v.accuracy*100]),colors[0]]])}`)}</div>${terminal('cnn_history.json',logs.slice(-8))}`;source='로컬 실행 · 20라운드 학습 기록';
 }else if(t<34){
 const c=data.cnn_metrics.cases[t<29?0:1];
 const pred=[['학습 전',c.initial_probs],['연합학습 후',c.final_probs]].map(([label,pr],i)=>`<div class="prediction"><h3>${label}</h3>${pr.map((p,k)=>`<div class="prob"><span>${['정상','폐렴'][k]}</span><div class="track"><i style="width:${p*100}%;background:${i?colors[0]:'#9b9f9d'}"></i></div><span class="mono">${fmt(p*100)}%</span></div>`).join('')}<div>예측: ${pr[1]>pr[0]?'폐렴':'정상'}</div></div>`).join('');
 body=`<h1>같은 영상의 학습 전·후 예측<small>cnn_global_final.pt</small></h1><div class="grid inference">${panel('시험 영상',`<img class="xray" src="${image('test_'+c.index)}" alt="공개 연구용 X-ray"><div>데이터 라벨: ${['정상','폐렴'][c.label]}</div>`)}${panel('모델 예측',pred)}</div><section class="resultstrip"><span>전체 시험 세트</span><span>543 / 624 일치</span><span>87.0%</span><span class="muted">오분류 81장</span></section>`;source='MedMNIST+ / Yang et al. · CC BY 4.0 · 64×64 확대 표시 · 임상 검증 제외';
 }else if(t<54){
 const hist=data.lora.federated,wall=hist.at(-1).elapsed*Math.min(1,(t-34)/18.5),row=hist.filter(r=>r.elapsed<=wall).at(-1)||hist[0],r=row.round;
 const deps=[['운영','P1 장애 → 10분 내 당직 SRE 보고'],['고객지원','골드 고객 → 30분 내 첫 응답'],['보안','외부 로그 → 마스킹·보안팀 승인']];
 const clients=deps.map(([name,rule],i)=>`<div class="dep"><h3 style="color:${colors[i]}">${name}<span class="mono" style="float:right;font-size:21px;color:#303332">loss=${row.clients[i].loss.toFixed(6)}</span></h3><p class="muted">${rule}</p></div>`).join('');
 const logs=hist.slice(Math.max(0,r-7),r).map(rr=>`round=${String(rr.round).padStart(2,'0')}  losses=[${rr.clients.map(c=>c.loss.toFixed(6)).join(', ')}]  elapsed=${rr.elapsed.toFixed(2)}s`);logs.push(`<span class="updated">front_adapter_mean  round=${r}  bytes=${row.adapter_bytes}  clients=3</span>`);
 body=`<h1>LoRA 학습　${r} / 16 라운드<small>Qwen2.5-0.5B / rank=16</small></h1><div class="grid">${panel('부서별 학습',clients)}${panel('학습 손실 · 로그 축',chart([0,1,2].map(i=>[hist.slice(0,r).map(rr=>[rr.round,rr.clients[i].loss]),colors[i]]),{xmin:1,xmax:16,ymin:-6,ymax:1,ticks:[1,-1,-3,-6],log:true}))}</div>${terminal('enterprise_history.json',logs)}`;source='로컬 실행 · 16라운드 학습 기록 · 고정 LoRA 랭크';
 }else if(t<66){
 const ix=t<60?6:12,local=data.lora_inference.models[1].questions[ix],fed=data.lora_inference.models[2].questions[ix];
 body=`<h1>업무 지침에 대한 답변 비교<small>저장 모델의 실제 생성 결과</small></h1>${panel('평가 질문',`<p class="question">${fed.q}</p>`)}<div class="answers">${[local,fed].map((r,i)=>panel(i?'운영 + 고객지원 + 보안 연합학습':'운영 부서만 학습',`<p class="answer">${r.answer}</p><div class="muted answerMeta">규정과 ${r.correct?'일치':'불일치'}</div><p class="mono muted">generation=${r.seconds.toFixed(2)}s　policy=${r.fact}</p>`)).join('')}</div><section class="resultstrip"><span>전체 18개 질문</span><span>기본 0/18</span><span>단독 6/18</span><span>연합 18/18</span></section>`;source='가상 업무 규정 9개를 다른 표현으로 질문한 결과';
 }else if(t<98){
 const rr=Math.min(23,4+Math.floor((t-66)/1.38)),runs=data.network_runs,a=runs.uniform[rr],b=runs.widthpath[rr],changes=[];
 for(const r of runs.widthpath.slice(Math.max(0,rr-3),rr+1))for(const c of r.changes)changes.push([r.round,c]);
 const rows=changes.slice(-8).map(([r,c])=>`${String(r).padStart(2,'0')}    ${String(c.client).padEnd(5)} ${(c.path_before+'→'+c.path_after).padEnd(12)} ${c.width_before.toFixed(2)}→${c.width_after.toFixed(2)}`);
 const mean=p=>runs[p].slice(4,rr+1).reduce((s,r)=>s+r.makespan,0)/(rr-3),u=mean('uniform'),v=mean('widthpath');
 body=`<h1>KOREN · 트래픽 몰림　${rr} 라운드<small>32 clients / seed=1 / CIFAR-10</small></h1><div class="grid timeGrid">${panel('라운드 완료 시간 (초)',`<div class="legend"><span style="color:#9b9f9d">― 기준 방식</span><span style="color:${colors[0]}">― AwareNet</span></div>${chart(['uniform','widthpath'].map((p,i)=>[runs[p].slice(0,rr+1).map(r=>[r.round,r.makespan]),i?colors[0]:'#9b9f9d']),{xmin:4,xmax:23,ymin:0,ymax:200,ticks:[0,100,200]})}<div class="muted" style="font-size:18px">실제 기록을 라운드 번호로 정렬</div>`)}${panel('경로·채널 비율 변경',`<div class="change mono"><span class="muted">round client relay   width</span>\n${rows.join('\n')||'현재 배정 유지'}</div>`)}</div><section class="resultstrip"><span>현재까지 평균 (r4–r${rr})</span><span>${fmt(u)}s → ${fmt(v)}s</span><span>${fmt(100*(1-v/u))}% 단축</span></section><p class="note muted">기준: 전폭·고정 배정·연결 1개　　AwareNet: 폭·경로 조정·연결 2개</p>${terminal('wp_scen32_traffic_s1_bothmp_*.jsonl',[`uniform    round=${rr}  makespan=${a.makespan.toFixed(4)}s`,`<span class="updated">widthpath  round=${rr}  makespan=${b.makespan.toFixed(4)}s  changed=${b.changes.length}</span>`])}`;source='기존 KOREN 실측 · 앞의 로컬 학습과 별도 실행';
 }else{
 const rows=data.network_summary.map(r=>`<tr><td>${r.label}</td><td><i class="mini" style="width:${r.uniform*2.5}px"></i>${fmt(r.uniform)}초</td><td><i class="mini" style="width:${r.widthpath*2.5}px;background:${colors[0]}"></i>${fmt(r.widthpath)}초</td><td>${fmt(r.reduction_pct)}%</td></tr>`).join('');
 body=`<h1>기준 방식 대비 라운드 완료 시간<small>KOREN / 24 rounds × 3 seeds</small></h1>${panel('원로그 24개 재집계 · 초기 4라운드 제외',`<table class="summary"><thead><tr><th>조건</th><th>기준 방식</th><th>AwareNet</th><th>시간 단축</th></tr></thead><tbody>${rows}</tbody></table>`)}<section class="body" style="margin-top:25px"><p>비교 조건　전폭·고정 배정·연결 1개　/　폭·경로 조정·연결 2개</p><p>측정 지표　라운드 완료 시간</p><p class="muted">최종 정확도 차이　정상 +4.63%p / 몰림 −0.50%p / 연산 −1.20%p / 용량 −2.85%p</p></section>`;source='전체 구성 비교 · 연결 수 차이 포함 · 목표 정확도 도달 시간과 구분';
 }
 q('#content').innerHTML=body;q('#source').innerHTML=source+'<span>원자료: <a href="evidence.html">자료 색인</a></span>';q('#clock').textContent=sec(t)+' / 01:52';q('#seek').value=t;
 if(t>=66&&t<98)q('.console').style.height='150px';
}
function setTime(v){t=Math.max(0,Math.min(112,v));render();lastDraw=t;}
q('#play').onclick=()=>{playing=!playing;last=performance.now();q('#play').textContent=playing?'일시정지':'재생';};
q('#reset').onclick=()=>setTime(0);q('#seek').oninput=e=>setTime(Number(e.target.value));document.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>setTime(Number(b.dataset.seek)));
function tick(now){if(playing){t=Math.min(112,t+(now-last)/1000);if(t-lastDraw>=.15){render();lastDraw=t;}if(t>=112){playing=false;q('#play').textContent='재생';window.replayDone=true;}}last=now;requestAnimationFrame(tick);}
fetch('assets/demo/viewer-data.json').then(r=>r.json()).then(d=>{data=d;render();window.viewerReady=true;window.viewerSeek=setTime;requestAnimationFrame(tick);}).catch(e=>q('#content').textContent=e.message);
</script></body></html>
